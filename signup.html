<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account • AI Study Assistant</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/js/auth.js" defer></script>
</head>
<body data-page="signup">
  <header class="top-bar">
    <div class="logo">AI Study Assistant</div>
    <nav class="nav-links" data-nav-links>
      <a href="/login.html">Log In</a>
      <a href="/index.html">Home</a>
    </nav>
  </header>
  <main class="main-content form-page">
    <section class="form-card">
      <h1>Create your account</h1>
      <form id="signup-form" class="form" enctype="multipart/form-data">
        <label>
          Full name
          <input name="name" type="text" required autocomplete="name">
        </label>
        <label>
          Email
          <input name="email" type="email" required autocomplete="email">
        </label>
        <label>
          Password
          <input name="password" type="password" required minlength="8" autocomplete="new-password">
        </label>
        <button class="btn primary" type="submit">Sign Up</button>
      </form>
      <p class="switch-link">Already have an account? <a href="/login.html">Log in</a>.</p>
    </section>
    <section class="ad-banner narrow">
      <h2>Sponsored</h2>
      <iframe title="Adsterra Banner" src="https://ads.adsterra.com/banner?pid=YOUR_PLACEMENT_ID" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
  </main>
  <footer class="footer">
    <span>&copy; <span data-year></span> AI Study Assistant</span>
  </footer>
</body>
</html>
